[project]
name = "shadeshift-api"
version = "0.1.0"
description = "Observed vegetation analysis API for ShadeShift"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "python-multipart>=0.0.9,<1",
  "numpy>=1.26,<3",
  "Pillow>=10,<12",
  "opencv-python-headless>=4.10,<5",
  "torch>=2.2,<3",
  "transformers>=4.45,<5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "httpx>=0.27,<1",
  "ruff>=0.6,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
